{% extends "base.html" %}

{% block title %}Edit Opportunity - InterSpark{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Back Button -->
    <div class="mb-6">
        <a href="{{ url_for('opportunity_details', id=opportunity.id) }}"
            class="inline-flex items-center text-blue-600 hover:text-blue-800">
            <i class="fas fa-arrow-left mr-2"></i>
            Back to Opportunity
        </a>
    </div>

    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Edit Opportunity</h1>
        <p class="mt-1 text-gray-500">Update your opportunity details</p>
    </div>

    <div class="bg-white shadow rounded-lg">
        <form method="POST" class="divide-y divide-gray-200">
            <!-- Basic Information -->
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Basic Information</h3>
                <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                    <div class="sm:col-span-4">
                        <label for="title" class="block text-sm font-medium text-gray-700">Opportunity Title *</label>
                        <div class="mt-1">
                            <input type="text" name="title" id="title" required value="{{ opportunity.title }}"
                                placeholder="e.g., Web Development Intern, Marketing Assistant"
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md">
                        </div>
                    </div>

                    <div class="sm:col-span-2">
                        <label for="type" class="block text-sm font-medium text-gray-700">Type *</label>
                        <div class="mt-1">
                            <select name="type" id="type" required
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md">
                                <option value="">Select Type</option>
                                <option value="Internship" {% if opportunity.type=='Internship' %}selected{% endif %}>
                                    Internship</option>
                                <option value="Volunteer" {% if opportunity.type=='Volunteer' %}selected{% endif %}>
                                    Volunteer</option>
                            </select>
                        </div>
                    </div>

                    <div class="sm:col-span-6">
                        <label for="location" class="block text-sm font-medium text-gray-700">Location *</label>
                        <div class="mt-1">
                            <input type="text" name="location" id="location" required value="{{ opportunity.location }}"
                                placeholder="City, State or Remote"
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Schedule & Timeline -->
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Schedule & Timeline</h3>
                <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                    <div class="sm:col-span-3">
                        <label for="duration" class="block text-sm font-medium text-gray-700">Duration</label>
                        <div class="mt-1">
                            <input type="text" name="duration" id="duration" value="{{ opportunity.duration or '' }}"
                                placeholder="e.g., Summer 2024, 3 months, Ongoing"
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md">
                        </div>
                    </div>

                    <div class="sm:col-span-3">
                        <label for="application_deadline" class="block text-sm font-medium text-gray-700">Application
                            Deadline</label>
                        <div class="mt-1">
                            <input type="date" name="application_deadline" id="application_deadline"
                                value="{{ opportunity.application_deadline or '' }}"
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Description & Details -->
            <div class="px-4 py-5 sm:p-6">
                <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Opportunity Details</h3>
                <div class="space-y-6">
                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700">Description *</label>
                        <div class="mt-1">
                            <textarea name="description" id="description" rows="6" required
                                placeholder="Describe the opportunity, what the student will do, and what they'll learn..."
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md">{{ opportunity.description }}</textarea>
                        </div>
                    </div>

                    <div>
                        <label for="requirements" class="block text-sm font-medium text-gray-700">Requirements</label>
                        <div class="mt-1">
                            <textarea name="requirements" id="requirements" rows="4"
                                placeholder="List any skills, experience, or qualifications needed..."
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md">{{ opportunity.requirements or '' }}</textarea>
                        </div>
                    </div>

                    <div>
                        <label for="compensation" class="block text-sm font-medium text-gray-700">Compensation</label>
                        <div class="mt-1">
                            <input type="text" name="compensation" id="compensation"
                                value="{{ opportunity.compensation or '' }}"
                                placeholder="e.g., $15/hour, Unpaid, College Credit Available"
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="px-4 py-4 sm:px-6 flex justify-between">
                <a href="{{ url_for('opportunity_details', id=opportunity.id) }}"
                    class="bg-gray-200 border border-gray-200 rounded-md shadow-sm py-2 px-4 inline-flex justify-center text-sm font-medium text-gray-700 hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                    Cancel
                </a>
                <button type="submit"
                    class="bg-blue-600 border border-transparent rounded-md shadow-sm py-2 px-4 inline-flex justify-center text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    <i class="fas fa-save mr-2"></i>
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
