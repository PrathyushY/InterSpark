{% extends "base.html" %}

{% block title %}Sign Up - InterSpark{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Create your account</h2>
        <p class="mt-2 text-center text-sm text-gray-600">Or <a href="{{ url_for('login') }}"
                class="font-medium text-blue-600 hover:text-blue-500">sign
                in to your existing account</a></p>
    </div>
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <form class="space-y-6" method="POST" id="signup-form">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">I am a:</label>
                    <div class="relative bg-gray-200 rounded-lg p-1 w-fit mx-auto">
                        <div id="slider-indicator"
                            class="absolute top-1 left-1 w-32 h-8 bg-blue-600 rounded-md transition-transform duration-300 ease-in-out">
                        </div>
                        <div class="relative flex">
                            <button type="button" id="student-btn"
                                class="w-32 py-2 text-sm font-medium text-center rounded-md transition-colors duration-300 text-white z-10"
                                onclick="Signup.selectUserType('student')">
                                Student
                            </button>
                            <button type="button" id="organization-btn"
                                class="w-32 py-2 text-sm font-medium text-center rounded-md transition-colors duration-300 text-gray-700 z-10"
                                onclick="Signup.selectUserType('organization')">
                                Organization
                            </button>
                        </div>
                        <input type="hidden" name="user_type" id="user_type" value="student">
                    </div>
                </div>
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700"><span id="name-label">Full
                            Name</span>
                        <span class="text-red-500">*</span></label>
                    <div class="mt-1"><input id="name" name="name" type="text" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email address <span
                            class="text-red-500">*</span></label>
                    <div class="mt-1"><input id="email" name="email" type="email" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                <div id="student-fields" class="space-y-6">
                    <div>
                        <label for="school" class="block text-sm font-medium text-gray-700">School <span
                                class="text-red-500">*</span></label>
                        <div class="mt-1"><input id="school" name="school" type="text"
                                class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                    </div>
                    <div>
                        <label for="grade" class="block text-sm font-medium text-gray-700">Grade <span
                                class="text-red-500">*</span></label>
                        <div class="mt-1"><select id="grade" name="grade"
                                class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                <option value="">Select Grade</option>
                                <option value="9th Grade">9th Grade</option>
                                <option value="10th Grade">10th Grade</option>
                                <option value="11th Grade">11th Grade</option>
                                <option value="12th Grade">12th Grade</option>
                            </select></div>
                    </div>

                </div>
                <div id="organization-fields" class="space-y-6 hidden">
                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700">Organization
                            Description <span class="text-red-500">*</span></label>
                        <div class="mt-1"><textarea id="description" name="description" rows="3"
                                class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password <span
                            class="text-red-500">*</span></label>
                    <div class="mt-1"><input id="password" name="password" type="password" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm Password
                        <span class="text-red-500">*</span></label>
                    <div class="mt-1"><input id="confirm-password" name="confirm_password" type="password" required
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Create Account
                    </button>
                </div>
                <div class="mt-4">
                    <p class="text-center text-sm text-gray-600">Or sign up with</p>
                    <div class="mt-2 flex gap-2">
                        <button id="google-signup-student" type="button"
                                class="w-1/2 inline-flex justify-center items-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white hover:bg-gray-50">
                            <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google"
                                 class="h-5 w-5 mr-2"> Student
                        </button>
                        <button id="google-signup-org" type="button"
                                class="w-1/2 inline-flex justify-center items-center py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white hover:bg-gray-50">
                            <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google"
                                 class="h-5 w-5 mr-2"> Organization
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/signup.js') }}"></script>
<script>
    document.getElementById('google-signup-student').addEventListener('click', function(){
        window.location = '/auth/google?user_type=student';
    });
    document.getElementById('google-signup-org').addEventListener('click', function(){
        window.location = '/auth/google?user_type=organization';
    });
</script>
{% endblock %}
